<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnEnglish – Teacher Katrine Riccaldoni</title>
<style>
  :root {
    --blue: #5b8fd4;
    --blue-dark: #3a6cb0;
    --blue-light: #e8f0fb;
    --black: #111;
    --gray: #555;
    --gray-light: #f4f6fb;
    --white: #fff;
    --green: #27ae60;
    --red: #e74c3c;
    --yellow: #f39c12;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(91,143,212,.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--blue-light);
    color: var(--black);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--blue);
    color: var(--white);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.3px; }
  header span { font-size: .85rem; opacity: .85; margin-left: auto; }
  #headerBack {
    display: none;
    background: rgba(255,255,255,.2);
    border: none; border-radius: 8px;
    color: var(--white); padding: 6px 14px;
    cursor: pointer; font-size: .9rem; font-weight: 600;
  }
  #headerBack:hover { background: rgba(255,255,255,.35); }

  /* ── SCREENS ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ═══════════ TRAIL SCREEN ═══════════ */
  #trailScreen { padding: 28px; max-width: 900px; margin: 0 auto; }
  #trailScreen h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }
  #trailScreen p.sub { color: var(--gray); margin-bottom: 28px; font-size: .95rem; }

  .trail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }
  .lesson-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all .2s;
    position: relative;
    overflow: hidden;
  }
  .lesson-card:hover { border-color: var(--blue); transform: translateY(-3px); }
  .lesson-card .lesson-num {
    font-size: .75rem; font-weight: 700; text-transform: uppercase;
    color: var(--blue); letter-spacing: 1px; margin-bottom: 8px;
  }
  .lesson-card h3 { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
  .lesson-card p { font-size: .85rem; color: var(--gray); line-height: 1.5; }
  .lesson-card .meta {
    margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap;
  }
  .tag {
    background: var(--blue-light); color: var(--blue-dark);
    padding: 3px 10px; border-radius: 20px; font-size: .75rem; font-weight: 600;
  }
  .lesson-card .status-bar {
    height: 4px; border-radius: 2px;
    background: #e0e7f5; margin-top: 16px; overflow: hidden;
  }
  .lesson-card .status-fill {
    height: 100%; border-radius: 2px;
    background: var(--blue); transition: width .4s;
  }
  .lesson-card .status-label {
    font-size: .75rem; color: var(--gray); margin-top: 5px;
  }

  /* ═══════════ LESSON SCREEN ═══════════ */
  #lessonScreen { padding: 0; max-width: 900px; margin: 0 auto; }

  .lesson-hero {
    background: var(--blue);
    color: var(--white);
    padding: 32px 36px 24px;
    border-radius: 0 0 var(--radius) var(--radius);
    margin-bottom: 0;
  }
  .lesson-hero .badge { font-size: .75rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; opacity: .8; margin-bottom: 6px; }
  .lesson-hero h2 { font-size: 2rem; font-weight: 900; }

  .slide-nav {
    background: var(--white);
    padding: 14px 36px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid #e0e7f5;
    position: sticky; top: 56px; z-index: 50;
  }
  .slide-nav .nav-btn {
    border: none; border-radius: 8px; padding: 8px 18px;
    font-size: .9rem; font-weight: 700; cursor: pointer;
    transition: all .15s;
  }
  #prevSlide { background: var(--gray-light); color: var(--gray); }
  #prevSlide:hover:not(:disabled) { background: #dce4f0; }
  #nextSlide { background: var(--blue); color: var(--white); margin-left: auto; }
  #nextSlide:hover { background: var(--blue-dark); }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  #slideCounter { font-size: .85rem; color: var(--gray); font-weight: 600; }
  .dot-track { display: flex; gap: 5px; align-items: center; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #dce4f0;
    cursor: pointer; transition: all .2s;
  }
  .dot.active { background: var(--blue); transform: scale(1.3); }
  .dot.done { background: #a3bde8; }

  .slide-body { padding: 32px 36px; min-height: 380px; }

  /* ── Slide types ── */
  .slide-intro {
    text-align: center; padding: 60px 0;
  }
  .slide-intro .big { font-size: 2.8rem; font-weight: 900; margin-bottom: 10px; }
  .slide-intro .teacher-tag {
    display: inline-block;
    background: var(--blue); color: var(--white);
    padding: 6px 18px; border-radius: 20px;
    font-size: .85rem; font-weight: 700;
  }

  .slide-heading {
    font-size: 1.5rem; font-weight: 900; text-transform: uppercase;
    letter-spacing: -.5px; margin-bottom: 20px;
    border-bottom: 3px solid var(--blue-light); padding-bottom: 12px;
  }
  .slide-heading.big { font-size: 2rem; }

  .theory-point {
    background: var(--blue-light); border-left: 4px solid var(--blue);
    padding: 14px 18px; border-radius: 0 8px 8px 0;
    margin-bottom: 12px; font-size: .95rem; line-height: 1.6;
  }

  .example-box {
    background: var(--gray-light); border-radius: 10px;
    padding: 16px 20px; margin-top: 14px;
    font-family: 'Courier New', monospace; font-size: .9rem; color: var(--blue-dark);
  }
  .highlight { color: var(--blue-dark); font-weight: 700; }

  /* Table slides */
  .conj-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  .conj-table th {
    background: var(--blue); color: var(--white);
    padding: 10px 16px; text-align: left; font-size: .85rem;
  }
  .conj-table td {
    padding: 10px 16px; border-bottom: 1px solid #e8ecf5;
    font-size: .9rem;
  }
  .conj-table tr:nth-child(even) td { background: var(--blue-light); }
  .conj-table td:first-child { font-weight: 700; color: var(--blue-dark); }

  /* Irregular verbs grid */
  .verbs-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px; margin-top: 12px;
  }
  .verb-pair {
    background: var(--white);
    border: 1px solid #dce4f0; border-radius: 10px;
    padding: 12px 14px; cursor: pointer;
    transition: all .2s; display: flex; align-items: center; gap: 8px;
  }
  .verb-pair:hover { border-color: var(--blue); background: var(--blue-light); }
  .verb-pair .v-base { font-size: .8rem; color: var(--gray); }
  .verb-pair .v-past { font-size: 1rem; font-weight: 800; color: var(--blue-dark); }
  .verb-pair .speak-ico { margin-left: auto; font-size: 1.1rem; opacity: .6; }

  /* Clickable words */
  .clickable-word {
    display: inline-block;
    cursor: pointer; border-radius: 4px; padding: 1px 4px;
    transition: background .15s;
    border-bottom: 2px dotted var(--blue);
    color: var(--blue-dark); font-weight: 600;
  }
  .clickable-word:hover { background: var(--blue-light); }

  /* Practice slide */
  .practice-cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px; margin-top: 8px;
  }
  .practice-card {
    background: var(--white); border-radius: var(--radius);
    padding: 24px; text-align: center; box-shadow: var(--shadow);
    border-top: 4px solid var(--blue);
  }
  .practice-card .num {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--blue); color: var(--white);
    font-size: 1.1rem; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
  }
  .practice-card p { font-size: .9rem; color: var(--gray); line-height: 1.5; }

  /* Expression chips */
  .expr-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .expr-chip {
    background: var(--white);
    border: 2px solid var(--blue-light);
    border-radius: 30px; padding: 8px 18px;
    cursor: pointer; transition: all .2s;
  }
  .expr-chip:hover { border-color: var(--blue); background: var(--blue-light); }
  .expr-chip .en { font-size: .95rem; font-weight: 700; color: var(--blue-dark); }
  .expr-chip .pt { font-size: .75rem; color: var(--gray); }

  /* ═══════════ EXERCISES ═══════════ */
  #exerciseScreen { padding: 28px; max-width: 720px; margin: 0 auto; }
  #exerciseScreen h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
  #exerciseScreen p.sub { color: var(--gray); margin-bottom: 24px; }

  .exercise-card {
    background: var(--white); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px; margin-bottom: 20px;
  }
  .exercise-card .ex-num {
    font-size: .75rem; font-weight: 700; text-transform: uppercase;
    color: var(--blue); letter-spacing: 1px; margin-bottom: 10px;
  }
  .exercise-card .question {
    font-size: 1.05rem; font-weight: 700; margin-bottom: 18px; line-height: 1.5;
  }
  .options-list { display: flex; flex-direction: column; gap: 10px; }
  .opt-btn {
    border: 2px solid #dce4f0; border-radius: 10px;
    padding: 12px 18px; text-align: left;
    background: var(--gray-light); cursor: pointer; font-size: .95rem;
    transition: all .2s;
  }
  .opt-btn:hover:not(.answered) { border-color: var(--blue); background: var(--blue-light); }
  .opt-btn.correct { border-color: var(--green); background: #edfbf4; color: var(--green); font-weight: 700; }
  .opt-btn.wrong { border-color: var(--red); background: #fef0ef; color: var(--red); }
  .opt-btn.reveal { border-color: var(--green); background: #edfbf4; color: var(--green); }

  .fill-blank-row {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .fill-input {
    border: 2px solid #dce4f0; border-radius: 8px; padding: 10px 14px;
    font-size: .95rem; flex: 1; min-width: 140px; outline: none;
    transition: border .2s;
  }
  .fill-input:focus { border-color: var(--blue); }
  .fill-input.correct { border-color: var(--green); background: #edfbf4; }
  .fill-input.wrong { border-color: var(--red); background: #fef0ef; }
  .submit-btn {
    background: var(--blue); color: var(--white);
    border: none; border-radius: 8px; padding: 10px 20px;
    font-size: .9rem; font-weight: 700; cursor: pointer;
  }
  .submit-btn:hover { background: var(--blue-dark); }

  .feedback {
    margin-top: 14px; padding: 12px 16px; border-radius: 8px; font-size: .88rem;
  }
  .feedback.correct { background: #edfbf4; color: var(--green); }
  .feedback.wrong { background: #fef0ef; color: var(--red); }

  .score-banner {
    background: var(--blue); color: var(--white);
    border-radius: var(--radius); padding: 32px; text-align: center;
    margin-bottom: 24px;
  }
  .score-banner .score-num { font-size: 3rem; font-weight: 900; }
  .score-banner p { opacity: .85; margin-top: 6px; }
  .back-trail-btn {
    display: block; width: 100%; background: var(--blue); color: var(--white);
    border: none; border-radius: 10px; padding: 14px;
    font-size: 1rem; font-weight: 700; cursor: pointer; text-align: center;
  }
  .back-trail-btn:hover { background: var(--blue-dark); }

  /* ═══════════ PRONUNCIATION PANEL ═══════════ */
  .pronunc-panel {
    background: var(--white); border-radius: var(--radius);
    box-shadow: 0 8px 32px rgba(0,0,0,.18);
    padding: 28px; margin-top: 20px;
    display: none;
  }
  .pronunc-panel.open { display: block; }
  .pronunc-panel h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
  .pronunc-panel .phonetic { color: var(--gray); font-size: .9rem; margin-bottom: 16px; }
  .pronunc-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .p-btn {
    border: none; border-radius: 8px; padding: 10px 18px;
    font-size: .9rem; font-weight: 700; cursor: pointer;
  }
  .p-btn.listen { background: var(--blue); color: var(--white); }
  .p-btn.mic { background: var(--green); color: var(--white); }
  .p-btn.mic.recording { background: var(--red); animation: pulse .8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  .p-btn.close-p { background: var(--gray-light); color: var(--gray); }
  .pronunc-result { margin-top: 14px; font-size: .9rem; }
  .pronunc-result .score-chip {
    display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 700;
  }
  .score-chip.high { background: #edfbf4; color: var(--green); }
  .score-chip.mid { background: #fff8e6; color: var(--yellow); }
  .score-chip.low { background: #fef0ef; color: var(--red); }

  /* ── Tooltip ── */
  .tooltip-box {
    position: fixed; background: #1a1a2e; color: var(--white);
    padding: 10px 14px; border-radius: 10px; font-size: .85rem;
    pointer-events: none; z-index: 9999;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
    max-width: 220px; display: none;
  }
  .tooltip-box .tt-en { font-weight: 700; font-size: .95rem; }
  .tooltip-box .tt-pt { opacity: .75; font-size: .8rem; }
  .tooltip-box .tt-phonetic { color: #a8c4f0; font-size: .78rem; margin-top: 2px; }

  /* ─ responsive ─ */
  @media(max-width:600px){
    #trailScreen, #exerciseScreen { padding: 16px; }
    .slide-body { padding: 20px; }
    .slide-nav { padding: 12px 16px; }
    .lesson-hero { padding: 22px 20px 16px; }
    .slide-intro .big { font-size: 2rem; }
  }
</style>
</head>
<body>

<header>
  <button id="headerBack" onclick="goBack()">← Trilha</button>
  <h1>📚 LearnEnglish</h1>
  <span>Teacher Katrine Riccaldoni</span>
</header>

<!-- TOOLTIP -->
<div class="tooltip-box" id="tooltip">
  <div class="tt-en" id="tt-en"></div>
  <div class="tt-pt" id="tt-pt"></div>
  <div class="tt-phonetic" id="tt-phonetic"></div>
</div>

<!-- ══════════════════════════════════ TRAIL ══════════════════════════════════ -->
<div id="trailScreen" class="screen active">
  <h2>Trilha de Aprendizado</h2>
  <p class="sub">Clique em uma lição para começar. Cada lição inclui teoria, exemplos interativos e exercícios.</p>
  <div class="trail-grid" id="trailGrid"></div>
</div>

<!-- ══════════════════════════════════ LESSON ═════════════════════════════════ -->
<div id="lessonScreen" class="screen">
  <div class="lesson-hero">
    <div class="badge" id="lessonBadge"></div>
    <h2 id="lessonTitle"></h2>
  </div>

  <div class="slide-nav">
    <button class="nav-btn" id="prevSlide" onclick="changeSlide(-1)">← Anterior</button>
    <div class="dot-track" id="dotTrack"></div>
    <span id="slideCounter"></span>
    <button class="nav-btn" id="nextSlide" onclick="changeSlide(1)">Próximo →</button>
  </div>

  <div class="slide-body" id="slideBody"></div>

  <!-- Pronunciation panel -->
  <div class="pronunc-panel" id="pronuncPanel" style="margin:0 36px 28px">
    <h3 id="pronuncWord"></h3>
    <div class="phonetic" id="pronuncPhonetic"></div>
    <div class="pronunc-actions">
      <button class="p-btn listen" onclick="speakWord()">🔊 Ouvir</button>
      <button class="p-btn mic" id="micBtn" onclick="toggleRecording()">🎤 Pronunciar</button>
      <button class="p-btn close-p" onclick="closePronunc()">✕ Fechar</button>
    </div>
    <div class="pronunc-result" id="pronuncResult"></div>
  </div>
</div>

<!-- ══════════════════════════════════ EXERCISES ══════════════════════════════ -->
<div id="exerciseScreen" class="screen">
  <h2 id="exTitle"></h2>
  <p class="sub" id="exSub"></p>
  <div id="exerciseList"></div>
  <div id="scoreSection" style="display:none">
    <div class="score-banner">
      <div class="score-num" id="scoreFinal"></div>
      <p id="scoreMsg"></p>
    </div>
    <button class="back-trail-btn" onclick="goBack()">← Voltar à Trilha</button>
  </div>
</div>

<script>
// ════════════════════════════════════════
//  DATA — conteúdo extraído das aulas PDF
// ════════════════════════════════════════
const LESSONS = [
  {
    id: 1, num: 1, title: "Verb to Be", topic: "Fundamentos",
    desc: "O verbo mais fundamental do inglês. Aprenda a conjugar to be no presente, passado e futuro.",
    slides: [
      { type:'intro', title:'Verb to Be', lesson:'Lesson 1' },
      { type:'theory', heading:'O que é o Verb to Be?',
        points:[
          'Para entender o sentido do verbo <b>to be</b> na frase, é necessário entender o contexto da mensagem como um todo.',
          'O verbo <b>to be</b> é classificado como um verbo <b>irregular</b>, já que não segue as regras de formação do simple past e do past participle.',
          'O verbo <b>to be</b> pode ser utilizado como verbo <b>principal</b> ou como verbo <b>auxiliar</b> de alguns tempos verbais.'
        ]
      },
      { type:'table', heading:'Conjugação: Simple Present',
        headers:['Subject','Afirmativa','Negativa'],
        rows:[['I','am','am not'],['You','are','are not'],['He/She/It','is','is not'],['We','are','are not'],['You','are','are not'],['They','are','are not']]
      },
      { type:'table', heading:'Conjugação: Simple Past',
        headers:['Subject','Afirmativa','Negativa'],
        rows:[['I','was','was not'],['You','were','were not'],['He/She/It','was','was not'],['We','were','were not'],['You','were','were not'],['They','were','were not']]
      },
      { type:'table', heading:'Conjugação: Simple Future',
        headers:['Subject','Afirmativa','Negativa'],
        rows:[['I','will be','will not be'],['You','will be','will not be'],['He/She/It','will be','will not be'],['We','will be','will not be'],['You','will be','will not be'],['They','will be','will not be']]
      },
      { type:'examples', heading:'Estrutura',
        sections:[
          { title:'Affirmative form', formula:'Subject + verb to be + complement',
            examples:['He <mark>is</mark> a mechanical engineer','He <mark>was</mark> a mechanical engineer','He <mark>will be</mark> a mechanical engineer'] },
          { title:'Negative form', formula:'Subject + verb to be + not + complement',
            examples:['He <mark>is not</mark> a mechanical engineer','He <mark>was not</mark> a mechanical engineer','He <mark>will not be</mark> a mechanical engineer'] },
          { title:'Interrogative form', formula:'Verb to be + subject + complement',
            examples:['<mark>Is</mark> he a mechanical engineer?','<mark>Was</mark> he a mechanical engineer?','<mark>Will</mark> he <mark>be</mark> a mechanical engineer?'] }
        ]
      },
      { type:'practice', heading:"Let's Practice!",
        activities:[
          { num:1, text:'Make an affirmative sentence about you' },
          { num:2, text:'Ask a question' },
          { num:3, text:'Make a negative sentence about someone' }
        ]
      }
    ],
    exercises:[
      { id:1, type:'mc', q:'Which form of "to be" is correct for "I" in the Simple Present?', opts:['am','is','are','were'], ans:'am', exp:'Para "I" no Simple Present: I <b>am</b> happy.' },
      { id:2, type:'mc', q:'Choose the correct sentence:', opts:['She am a teacher.','She is a teacher.','She are a teacher.','She be a teacher.'], ans:'She is a teacher.', exp:'He/She/It → <b>is</b> no Simple Present.' },
      { id:3, type:'fill', q:'Complete: They ___ students.', ans:'are', exp:'We/You/They → <b>are</b> no Simple Present.' },
      { id:4, type:'mc', q:'What is the past form of "is"?', opts:['was','were','be','been'], ans:'was', exp:'I/He/She/It → <b>was</b> no Simple Past.' },
    ]
  },
  {
    id: 3, num: 3, title: "Simple Present", topic: "Presente Simples",
    desc: "Hábitos, rotinas, sentimentos e verdades universais. Domine o tempo verbal mais usado no inglês.",
    slides: [
      { type:'intro', title:'Simple Present', lesson:'Lesson 3' },
      { type:'theory', heading:'What is Simple Present?',
        points:[
          'The Simple Present is a verb tense used to talk about <b>habits and routines</b>.',
          'We also use it to express <b>feelings, opinions</b>, and <b>universal truths</b>.',
          'Example: I <mark>like</mark> to play videogames'
        ]
      },
      { type:'examples', heading:'The Structure',
        sections:[
          { title:'Affirmative form', formula:'Subject + main verb + complement', examples:['I <mark>like</mark> cookies'] },
          { title:'Negative Form', formula:'Subject + auxiliary verb + not + main verb + complement', examples:['I <mark>do not</mark> like chocolate'] },
          { title:'Interrogative form', formula:'Auxiliary verb + subject + main verb + complement', examples:['<mark>Do</mark> we have class today?','Yes, we <mark>do</mark> &nbsp; / &nbsp; No, we <mark>do not</mark>'] }
        ]
      },
      { type:'table', heading:'Important: He/She/It changes the verb',
        headers:['Subject','Verb form','Example'],
        rows:[['I','base form','work'],['You','base form','work'],['He/She/It','base + s/es/ies','works'],['We','base form','work'],['You','base form','work'],['They','base form','work']]
      },
      { type:'theory', heading:'Verb Conjugation Rules (He/She/It)',
        points:[

function renderTrail() {
  const grid = document.getElementById('trailGrid');
  grid.innerHTML = '';
  LESSONS.forEach(lesson => {
    const p = progress[lesson.id] || { status:'not_started', slide:0 };
    const pct = p.status === 'completed' ? 100
              : p.status === 'in_progress' ? Math.round((p.slide / lesson.slides.length) * 100)
              : 0;
    const statusLabel = p.status === 'completed' ? '✅ Concluída'
                      : p.status === 'in_progress' ? '▶ Em andamento'
                      : '⭕ Não iniciada';
    const card = document.createElement('div');
    card.className = 'lesson-card';
    card.innerHTML = `
      <div class="lesson-num">Lição ${lesson.num}</div>
      <h3>${lesson.title}</h3>
      <p>${lesson.desc}</p>
      <div class="meta">
        <span class="tag">${lesson.topic}</span>
        <span class="tag">${lesson.slides.length} slides</span>
        <span class="tag">${lesson.exercises.length} exercícios</span>
      </div>
      <div class="status-bar"><div class="status-fill" style="width:${pct}%"></div></div>
      <div class="status-label">${statusLabel}${pct > 0 && pct < 100 ? ` — ${pct}%` : ''}</div>
    `;
    card.onclick = () => openLesson(lesson.id);
    grid.appendChild(card);
  });
}

function openLesson(id) {
  currentLesson = LESSONS.find(l => l.id === id);
  currentSlide = progress[id]?.slide || 0;
  if (currentSlide >= currentLesson.slides.length) currentSlide = 0;

  document.getElementById('lessonBadge').textContent = `Lição ${currentLesson.num} • ${currentLesson.topic}`;
  document.getElementById('lessonTitle').textContent = currentLesson.title;

  if (!progress[id]) progress[id] = { status:'in_progress', slide:0 };
  progress[id].status = 'in_progress';
  saveProgress();

  showScreen('lessonScreen');
  document.getElementById('headerBack').style.display = 'block';
  renderSlide();
  buildDots();
}

function renderSlide() {
  const slide = currentLesson.slides[currentSlide];
  const body = document.getElementById('slideBody');
  body.innerHTML = buildSlideHTML(slide);
  closePronunc();

  // Update nav
  document.getElementById('prevSlide').disabled = currentSlide === 0;
  const isLast = currentSlide === currentLesson.slides.length - 1;
  const nextBtn = document.getElementById('nextSlide');
  nextBtn.textContent = isLast ? '📝 Exercícios →' : 'Próximo →';
  document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${currentLesson.slides.length}`;

  // Update dots
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.className = 'dot' + (i === currentSlide ? ' active' : i < currentSlide ? ' done' : '');
  });

  // Save progress
  progress[currentLesson.id].slide = currentSlide;
  saveProgress();

  // Attach TTS to marked elements
  body.querySelectorAll('[data-word]').forEach(el => {
    el.addEventListener('click', e => {
      const w = el.getAttribute('data-word');
      speak(w);
      openPronuncPanel(w);
    });
  });
}

function wrapClickable(text) {
  // Wrap known vocabulary words in clickable spans
  let result = text;
  const known = Object.keys(DICT).sort((a,b) => b.length - a.length);
  known.forEach(word => {
    const safe = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`(?<![a-zA-Z<>="])(${safe})(?![a-zA-Z"'])`, 'gi');
    result = result.replace(re, (m) => {
      if (result.indexOf(`data-word="${m}"`) > -1) return m; // already wrapped
      return `<span class="clickable-word" data-word="${m.toLowerCase()}">${m}</span>`;
    });
  });
  return result;
}

function changeSlide(dir) {

  currentSlide = newSlide;
  renderSlide();
  document.getElementById('slideBody').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function buildDots() {
  const track = document.getElementById('dotTrack');
  track.innerHTML = '';
  currentLesson.slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentSlide ? ' active' : '');
    d.title = `Slide ${i+1}`;
    d.onclick = () => { currentSlide = i; renderSlide(); };
    track.appendChild(d);
  });
}

// ════════════════════════════════════════
//  TTS + PRONUNCIATION
// ════════════════════════════════════════
function speak(word) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  window.speechSynthesis.speak(utter);
}

function speakAndOpen(word, baseForm) {
  speak(word);
  openPronuncPanel(word, baseForm);
}

function openPronuncPanel(word, baseForm) {
  const w = word.toLowerCase();
  currentWord = w;
  const info = DICT[w] || [null, null];
  document.getElementById('pronuncWord').textContent = baseForm ? `${baseForm} → ${word}` : word;
  document.getElementById('pronuncPhonetic').textContent = info[1] ? `Fonética: ${info[1]}  |  ${info[0] || ''}` : (info[0] || '');
  document.getElementById('pronuncResult').innerHTML = '';
  document.getElementById('pronuncPanel').classList.add('open');
}

function closePronunc() {
  document.getElementById('pronuncPanel').classList.remove('open');
  if (isRecording) stopRecording();
  currentWord = null;
}

function speakWord() {
  if (currentWord) speak(currentWord);
}

function toggleRecording() {
  if (isRecording) { stopRecording(); return; }
  startRecording();
}

function startRecording() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('pronuncResult').innerHTML =
      '<span style="color:var(--red)">⚠ Reconhecimento de voz não suportado neste navegador. Use Chrome.</span>';
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isRecording = true;
    const btn = document.getElementById('micBtn');
    btn.textContent = '⏹ Parar';
    btn.classList.add('recording');
    document.getElementById('pronuncResult').innerHTML = '<i style="color:var(--gray)">Ouvindo...</i>';
  };

  recognition.onresult = (e) => {
    const heard = e.results[0][0].transcript.toLowerCase().trim();
    const target = currentWord?.toLowerCase().trim();
    const score = calcSimilarity(heard, target);
    showPronuncResult(heard, target, score);
  };

  recognition.onerror = (e) => {
    document.getElementById('pronuncResult').innerHTML =
      `<span style="color:var(--red)">Erro: ${e.error}. Verifique o microfone.</span>`;
    stopRecording();
  };

  recognition.onend = () => stopRecording();
  recognition.start();
}

function stopRecording() {
  isRecording = false;
  if (recognition) { try { recognition.stop(); } catch(e){} }
  const btn = document.getElementById('micBtn');
  btn.textContent = '🎤 Pronunciar';
  btn.classList.remove('recording');
}

function calcSimilarity(a, b) {
  if (!a || !b) return 0;
  if (a === b) return 100;
  // Simple: check if target word is in the heard phrase
  if (a.includes(b)) return 95;
  // Levenshtein-based
  const la = a.split(''), lb = b.split('');
  const dp = Array.from({length:la.length+1}, (_,i) =>
    Array.from({length:lb.length+1}, (_,j) => i===0?j:j===0?i:0));
  for (let i=1;i<=la.length;i++)
    for (let j=1;j<=lb.length;j++)
      dp[i][j] = la[i-1]===lb[j-1]
        ? dp[i-1][j-1]
        : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  const dist = dp[la.length][lb.length];
  return Math.max(0, Math.round((1 - dist / Math.max(la.length, lb.length)) * 100));
}

function showPronuncResult(heard, target, score) {
  const cls = score >= 80 ? 'high' : score >= 50 ? 'mid' : 'low';
  const emoji = score >= 80 ? '🎉' : score >= 50 ? '👍' : '😅';
  const msg = score >= 80 ? 'Excelente pronúncia!' : score >= 50 ? 'Bom, continue praticando!' : 'Tente novamente, ouça primeiro!';
  document.getElementById('pronuncResult').innerHTML = `
    <div>Você disse: <b>"${heard}"</b></div>
    <div style="margin-top:8px">
      <span class="score-chip ${cls}">${emoji} ${score}% — ${msg}</span>
    </div>`;
}

// ════════════════════════════════════════
//  TOOLTIP on hover
// ════════════════════════════════════════
function setupTooltip() {
  const tip = document.getElementById('tooltip');
  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-word]');
    if (!el) { tip.style.display = 'none'; return; }
    const w = el.getAttribute('data-word');
    const info = DICT[w];
    if (!info) return;
    document.getElementById('tt-en').textContent = w;
    document.getElementById('tt-pt').textContent = info[0] || '';
    document.getElementById('tt-phonetic').textContent = info[1] || '';
    tip.style.display = 'block';
    positionTip(e, tip);
  });
  document.addEventListener('mousemove', e => {
    if (tip.style.display === 'block') positionTip(e, tip);
  });
  document.addEventListener('mouseout', e => {
    if (!e.target.closest('[data-word]')) tip.style.display = 'none';
  });
}
function positionTip(e, tip) {
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + 240 > window.innerWidth) x = e.clientX - 250;
  if (y + 80 > window.innerHeight) y = e.clientY - 90;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}

// ════════════════════════════════════════
//  EXERCISES
// ════════════════════════════════════════
function openExercises() {
  document.getElementById('exTitle').textContent = `Exercícios: ${currentLesson.title}`;
  document.getElementById('exSub').textContent = `Lição ${currentLesson.num} — ${currentLesson.exercises.length} questões`;
  document.getElementById('scoreSection').style.display = 'none';

  const list = document.getElementById('exerciseList');
  list.innerHTML = '';
  currentLesson.exercises.forEach((ex, idx) => {
    list.appendChild(buildExerciseCard(ex, idx + 1));
  });

  showScreen('exerciseScreen');
  document.getElementById('headerBack').style.display = 'block';
}

function buildExerciseCard(ex, num) {
  const card = document.createElement('div');
  card.className = 'exercise-card';
  card.id = `ex-${ex.id}`;

  if (ex.type === 'mc') {
    card.innerHTML = `
      <div class="ex-num">Questão ${num}</div>
      <div class="question">${ex.q}</div>
      <div class="options-list">
        ${ex.opts.map(opt => `
          <button class="opt-btn" onclick="checkMC(this, '${opt.replace(/'/g,"\\'")}', '${ex.ans.replace(/'/g,"\\'")}', '${(ex.exp||'').replace(/'/g,"\\'")}', '${ex.id}')">
            ${opt}
          </button>`).join('')}
      </div>
      <div class="feedback" id="fb-${ex.id}" style="display:none"></div>`;
  } else if (ex.type === 'fill') {
    card.innerHTML = `
      <div class="ex-num">Questão ${num}</div>
      <div class="question">${ex.q}</div>
      <div class="fill-blank-row">
        <input class="fill-input" id="fi-${ex.id}" placeholder="Digite sua resposta..." onkeydown="if(event.key==='Enter')checkFill('${ex.id}','${ex.ans.replace(/'/g,"\\'")}','${(ex.exp||'').replace(/'/g,"\\'")}')">
        <button class="submit-btn" onclick="checkFill('${ex.id}','${ex.ans.replace(/'/g,"\\'")}','${(ex.exp||'').replace(/'/g,"\\'")}')">Verificar</button>
      </div>
      <div class="feedback" id="fb-${ex.id}" style="display:none"></div>`;
  }
  return card;
}

function checkMC(btn, chosen, correct, exp, exId) {
  const card = document.getElementById(`ex-${exId}`);
  if (card.querySelector('.answered')) return;
  const btns = card.querySelectorAll('.opt-btn');
  btns.forEach(b => {
    b.classList.add('answered');
    if (b.textContent.trim() === correct) b.classList.add('correct');
  });
  const isCorrect = chosen === correct;
  if (!isCorrect) btn.classList.add('wrong');
  showFeedback(exId, isCorrect, exp, correct);
  checkAllDone();
}

function checkFill(exId, correct, exp) {
  const input = document.getElementById(`fi-${exId}`);
  if (input.disabled) return;
  const val = input.value.trim();
  const isCorrect = val.toLowerCase() === correct.toLowerCase();
  input.disabled = true;
  input.classList.add(isCorrect ? 'correct' : 'wrong');
  showFeedback(exId, isCorrect, exp, correct);
  checkAllDone();
}

function showFeedback(exId, isCorrect, exp, correct) {
  const fb = document.getElementById(`fb-${exId}`);
  fb.style.display = 'block';
  fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
  fb.innerHTML = isCorrect
    ? `✅ Correto! ${exp ? `<br><small>${exp}</small>` : ''}`
    : `❌ Incorreto. Resposta correta: <b>${correct}</b><br><small>${exp}</small>`;
}

function checkAllDone() {
  const cards = document.querySelectorAll('.exercise-card');
  let done = 0, correct = 0;
  cards.forEach(c => {
    const hasCorrect = c.querySelector('.correct');
    const hasAnswered = c.querySelector('.answered, input[disabled]');
    if (hasAnswered) done++;
    if (hasCorrect && !c.querySelector('.wrong:not(.reveal)')) correct++;
  });
  if (done >= cards.length) {
    const pct = Math.round((correct / cards.length) * 100);
    progress[currentLesson.id].status = 'completed';
    progress[currentLesson.id].score = pct;
    saveProgress();
    setTimeout(() => showScore(pct, cards.length), 600);
  }
}

function showScore(pct, total) {
  document.getElementById('scoreFinal').textContent = `${pct}%`;
  const msg = pct >= 80 ? '🎉 Excelente trabalho! Lição concluída!' :
              pct >= 60 ? '👍 Bom trabalho! Continue praticando.' :
              '📚 Revise o conteúdo e tente novamente.';
  document.getElementById('scoreMsg').textContent = msg;
  document.getElementById('scoreSection').style.display = 'block';
  document.getElementById('scoreSection').scrollIntoView({ behavior:'smooth' });
}

// ════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goBack() {
  const active = document.querySelector('.screen.active')?.id;
  if (active === 'exerciseScreen') {
    showScreen('lessonScreen');
  } else {
    showScreen('trailScreen');
    document.getElementById('headerBack').style.display = 'none';
    renderTrail();
  }
}
